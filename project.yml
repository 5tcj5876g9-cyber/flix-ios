name: Flix
options:
  bundleIdPrefix: app.filmna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Flix:
    type: application
    platform: iOS
    sources:
      - path: Flix/Sources
    info:
      path: Flix/Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.filmna.flix
        PRODUCT_NAME: Flix
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
