name: ipa

# Builds an unsigned .ipa on a free macOS runner. No Apple account is involved in
# producing the file — signing happens on the user's own PC with Sideloadly and a
# free Apple ID (7-day certificate).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Flix.xcodeproj \
            -scheme Flix \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Flix.app"
          test -d "$APP"
          rm -rf Payload Flix-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # Sideloadly and AltStore both accept a plain stored zip.
          zip -qry Flix-unsigned.ipa Payload
          ls -lh Flix-unsigned.ipa
          shasum -a 256 Flix-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flix-unsigned-ipa
          path: Flix-unsigned.ipa
          retention-days: 14
